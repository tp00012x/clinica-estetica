<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7f3"/>
      <stop offset="100%" stop-color="#f3dcd4"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3dcd4"/>
      <stop offset="100%" stop-color="#9a4f5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative orbs -->
  <circle cx="960" cy="140" r="260" fill="url(#orb)" opacity="0.55"/>
  <circle cx="960" cy="140" r="260" fill="url(#glow)"/>
  <circle cx="140" cy="540" r="180" fill="#f3dcd4" opacity="0.65"/>

  <!-- Eyebrow -->
  <text x="90" y="200" font-family="Inter, system-ui, sans-serif" font-size="22"
        font-weight="500" fill="#9a4f5b" letter-spacing="4"
        style="text-transform: uppercase;">
    Clínica estética en Lima
  </text>

  <!-- Title -->
  <text x="90" y="310" font-family="Cormorant Garamond, Georgia, serif"
        font-size="88" font-weight="600" fill="#1f1a17">
    Lumina Estética
  </text>

  <!-- Subtitle -->
  <text x="90" y="400" font-family="Cormorant Garamond, Georgia, serif"
        font-size="44" font-weight="400" fill="#4a3f38">
    Medicina estética y cirugía plástica
  </text>

  <!-- Footer badge -->
  <rect x="90" y="500" rx="30" ry="30" width="340" height="60" fill="#1f1a17"/>
  <text x="260" y="540" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="20"
        font-weight="500" fill="#fbf7f3">
    Agenda tu consulta
  </text>

  <!-- Brand mark -->
  <text x="1110" y="580" text-anchor="end"
        font-family="Cormorant Garamond, Georgia, serif" font-size="26"
        font-weight="500" fill="#1f1a17">
    lumina-estetica.example
  </text>
</svg>
